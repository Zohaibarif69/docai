version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: smart_doctor_db
    environment:
      POSTGRES_DB: smart_doctor_connect
      POSTGRES_USER: doctor_connect
      POSTGRES_PASSWORD: secure_password_123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - smart_doctor_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U doctor_connect"]
      interval: 10s
      timeout: 5s
      retries: 5

  # FastAPI Backend
  backend:
    build: ./backend
    container_name: smart_doctor_api
    environment:
      DATABASE_URL: postgresql://doctor_connect:secure_password_123@postgres:5432/smart_doctor_connect
      DEBUG: "False"
      SECRET_KEY: your-super-secret-key-change-in-production
      BACKEND_CORS_ORIGINS: '["http://localhost:5173", "http://localhost:3000"]'
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/app:/app/app
    networks:
      - smart_doctor_network
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # React Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: smart_doctor_ui
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8000/api/v1
    volumes:
      - ./frontend/src:/app/src
    networks:
      - smart_doctor_network
    command: npm run dev

  # PgAdmin - Database Management
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: smart_doctor_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    networks:
      - smart_doctor_network
    depends_on:
      - postgres

volumes:
  postgres_data:
    driver: local

networks:
  smart_doctor_network:
    driver: bridge
