version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: smart_doctor_connect_db
    environment:
      POSTGRES_DB: smart_doctor_connect
      POSTGRES_USER: doctor_connect
      POSTGRES_PASSWORD: secure_password_123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - smart_doctor_network

  backend:
    build: .
    container_name: smart_doctor_connect_api
    environment:
      DATABASE_URL: postgresql://doctor_connect:secure_password_123@postgres:5432/smart_doctor_connect
      DEBUG: "False"
      SECRET_KEY: your-super-secret-key-change-in-production
      BACKEND_CORS_ORIGINS: '["http://localhost:3000", "http://localhost:5173"]'
    ports:
      - "8000:8000"
    depends_on:
      - postgres
    volumes:
      - ./app:/app/app
    networks:
      - smart_doctor_network
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: smart_doctor_connect_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    networks:
      - smart_doctor_network

volumes:
  postgres_data:

networks:
  smart_doctor_network:
    driver: bridge
